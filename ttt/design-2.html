<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Train the Trainer | The Missing P">
<meta property="og:description" content="Your experts know it. Now they'll teach it. Two days, measured before and after.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* DESIGN 2 · BRIGHT */
/* fonts: family=Poppins:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800 */
/* Bright: TMP blue with yellow and coral, airy white page, soft blue washes, generous rounded cards. Sister to the retreat page. */
:root{
  --bg:#FFFFFF; --ink:#0D1626; --muted:#566178; --line:#E2E9F3; --tint:#EEF5FD;
  --brand:#1F80E6; --on-brand:#fff; --accent:#FFC22E; --accent2:#FF6447;
  --dark:#0C2140; --on-dark:#fff; --on-dark-2:#B5C6E0;
  --radius:22px; --radius-sm:14px;
  --f-display:"Poppins","Helvetica Neue",Arial,sans-serif;
  --f-body:"Nunito Sans","Segoe UI",Arial,sans-serif;
}
h1,h2{font-weight:700;letter-spacing:-.025em}
h3{font-weight:600}
.top{background:rgba(255,255,255,.94);backdrop-filter:blur(8px)}
.s-hero{background:radial-gradient(900px 480px at 85% 10%,#DCEBFC 0%,rgba(220,235,252,0) 70%),radial-gradient(500px 300px at 0% 100%,#FFF3D1 0%,rgba(255,243,209,0) 70%)}
.h1b{color:var(--brand)}
.h1b::after{content:"";display:block;width:min(300px,70%);height:10px;margin-top:10px;border-radius:10px;background:linear-gradient(90deg,var(--brand) 0 33%,var(--accent) 33% 66%,var(--accent2) 66%)}
.hero-photo{border-radius:28px 28px 28px 120px}
.hero-small.hs0{border-radius:28px 80px 28px 28px}
.hero-badge{background:var(--accent2);color:#fff;transform:rotate(-3deg)}
.stat{background:#fff;border:1px solid var(--line);box-shadow:0 10px 30px -22px rgba(31,128,230,.6)}
.stat.s1 strong{color:#C98A00}.stat.s2 strong{color:var(--accent2)}
.mk{border-radius:50%}
.why-item.c1 .mk{background:#FFF4D6;color:#B57B00}.why-item.c2 .mk{background:#FFE6E0;color:#E0472B}
.loop li:nth-child(2) b{color:#C98A00}.loop li:nth-child(3) b{color:var(--accent2)}
.s-results{background:var(--dark)}
.callout.c1 strong{color:#8EC2FF}.callout.c2 strong{color:#FF9A85}
.badge.c1{background:var(--brand);color:#fff}.badge.c2{background:var(--accent2);color:#fff}
.q.c1 blockquote::before{color:#E0A100}.q.c2 blockquote::before{color:var(--accent2)}
.av{background:var(--tint);color:var(--brand)}
.q.feature .av{background:var(--accent);color:var(--ink)}
.track.c1 .for{color:#B57B00}.track.c2 .for{color:var(--accent2)}
.kit{background:linear-gradient(135deg,#0C2140,#163C73)}
.tstats div:nth-child(2){border-top-color:var(--accent)}.tstats div:nth-child(3){border-top-color:var(--accent2)}
.t-photo img{border-radius:28px 28px 120px 28px}
.s-plan::before{content:"";position:absolute;width:440px;height:440px;border-radius:50%;background:var(--accent);opacity:.18;top:-160px;left:-140px}
.progress i.on:nth-child(2){background:var(--accent)}.progress i.on:nth-child(3){background:var(--accent2)}

</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo-link" href="#hero" aria-label="The Missing P"><img src="assets/logos/tmp-logo.png" alt="The Missing P"></a>
<nav class="nav" aria-label="Sections"><a href="#results-sec">Results</a><a href="#work">Programs</a><a href="#days">The two days</a><a href="#trainer-sec">Trainer</a></nav>
<a class="btn" href="#plan">Plan your TTT</a></div></header>
<main>
  <section class="s-hero"><div class="wrap"><div id="hero"></div><div id="proof"></div></div></section>
  <section class="s-logos"><div class="wrap" id="logos"></div></section>
  <section class="s-problem"><div class="wrap" id="problem"></div></section>
  <section class="s-video"><div class="wrap" id="video"></div></section>
  <section class="s-why"><div class="wrap" id="why"></div></section>
  <section class="s-results" id="results-sec"><div class="wrap" id="results"></div></section>
  <section class="s-portfolio" id="work"><div class="wrap" id="portfolio"></div></section>
  <section class="s-voices"><div class="wrap" id="voices"></div></section>
  <section class="s-days" id="days"><div class="wrap" id="agenda"></div></section>
  <section class="s-tracks"><div class="wrap" id="tracks"></div></section>
  <section class="s-trainer" id="trainer-sec"><div class="wrap" id="trainer"></div></section>
  <section class="s-plan" id="plan"><div class="wrap plan-grid"><div id="plan-copy"></div><div id="leadbox"></div></div></section>
</main>
<footer><div class="wrap"><img src="assets/logos/tmp-logo.png" alt="The Missing P"><p id="foot-text"></p><a class="btn" href="#plan">Plan your TTT <span class="arr" aria-hidden="true">→</span></a></div></footer>
<div class="sticky" id="sticky"><p><b>Train the Trainer</b>Get a plan for your trainers in 1 min</p><a class="btn" href="#plan">Plan my TTT</a></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
