<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Train the Trainer | The Missing P</title>
<meta name="description" content="Train the Trainer: a two-day experiential workshop by The Missing P, led by Usman Gulzari. +44% pre to post scores, delivered for Faysal Bank, Engro, Nayatel and PIPS.">
<meta property="og:title" content="Train the Trainer | The Missing P">
<meta property="og:description" content="Your experts know it. Now they'll teach it. Two days, measured before and after.">
<meta property="og:image" content="assets/img/usman-stage.jpg">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logos/tmp-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<style>
/* DESIGN 1 · EXECUTIVE */
/* fonts: family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600;700 */
/* Executive: deep navy and warm gold. Navy hero band, white body, square-ish corners, consulting-firm calm. */
:root{
  --bg:#FFFFFF; --ink:#0F1B2D; --muted:#55627A; --line:#E1E6EE; --tint:#F3F6FA;
  --brand:#14396B; --on-brand:#fff; --accent:#E9A63A; --accent2:#C2410C;
  --dark:#0B1F3A; --on-dark:#fff; --on-dark-2:#B8C4D8;
  --radius:12px; --radius-sm:8px;
  --f-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-body:"Open Sans","Segoe UI",Arial,sans-serif;
}
h1,h2{font-weight:800;letter-spacing:-.02em}
h3{font-weight:700}
.btn{border-radius:8px;background:var(--accent);color:#1A1204}
.btn:hover{background:#F2B651}
.btn.ghost{color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.45)}
.btn.ghost:hover{box-shadow:inset 0 0 0 2px #fff}
.top{background:var(--dark);border-bottom-color:rgba(255,255,255,.08)}
body::before{background:var(--dark)}
.top .logo-link{background:#fff;border-radius:6px;padding:5px 9px}
.top .logo-link img{height:28px}
.nav a{color:#C9D3E3}.nav a:hover{color:#fff}

.s-hero{background:linear-gradient(160deg,#0B1F3A 0%,#14396B 100%);color:#fff;padding-block:64px 72px;position:relative}
.s-hero::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:var(--accent)}
.s-hero .eyebrow{color:var(--accent)}
.h1b{color:var(--accent)}
.sub{color:#C9D3E3}
.hero-photo,.hero-small{border:4px solid rgba(255,255,255,.08)}
.hero-badge{background:#fff;color:var(--brand);border-left:5px solid var(--accent)}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.stat strong{color:var(--accent)}
.stat span{color:#C9D3E3}

.s-logos{background:var(--tint);border:0}
.eyebrow{color:var(--accent2)}
.mk{background:var(--brand);color:#fff;border-radius:8px}
.why-item{border-top:3px solid var(--brand)}
.loop b{color:var(--accent2)}
.s-video{background:#fff;border-top:1px solid var(--line)}
.s-results{background:var(--dark)}
.badge{background:var(--accent)}
.tags span{background:#EAF0F8;color:var(--brand)}
.q.feature{background:var(--brand)}
.q blockquote::before{color:var(--accent)}
.mod[aria-selected="true"]{box-shadow:inset 4px 0 0 var(--accent);border-color:var(--brand)}
.m-stage{color:var(--accent2)}
.daytabs button[aria-selected="true"]{background:var(--brand)}
.tstats div{border-top-color:var(--accent)}
.t-photo img{box-shadow:16px 16px 0 var(--tint),16px 16px 0 1px var(--line)}
.s-plan{background:linear-gradient(160deg,#0B1F3A 0%,#14396B 100%)}
.promises li::before{background:var(--accent)}
#leadbox .btn{background:var(--brand);color:#fff}
.pills input:checked+span{background:var(--brand);border-color:var(--brand)}
.progress i.on{background:var(--accent)}
.sticky .btn,.top .btn{background:var(--accent);color:#1A1204}

</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo-link" href="#hero" aria-label="The Missing P"><img src="assets/logos/tmp-logo.png" alt="The Missing P"></a>
<nav class="nav" aria-label="Sections"><a href="#results-sec">Results</a><a href="#work">Programs</a><a href="#days">The two days</a><a href="#trainer-sec">Trainer</a></nav>
<a class="btn" href="#plan">Plan your TTT</a></div></header>
<main>
  <section class="s-hero"><div class="wrap"><div id="hero"></div><div id="proof"></div></div></section>
  <section class="s-logos"><div class="wrap" id="logos"></div></section>
  <section class="s-problem"><div class="wrap" id="problem"></div></section>
  <section class="s-video"><div class="wrap" id="video"></div></section>
  <section class="s-why"><div class="wrap" id="why"></div></section>
  <section class="s-results" id="results-sec"><div class="wrap" id="results"></div></section>
  <section class="s-portfolio" id="work"><div class="wrap" id="portfolio"></div></section>
  <section class="s-voices"><div class="wrap" id="voices"></div></section>
  <section class="s-days" id="days"><div class="wrap" id="agenda"></div></section>
  <section class="s-tracks"><div class="wrap" id="tracks"></div></section>
  <section class="s-trainer" id="trainer-sec"><div class="wrap" id="trainer"></div></section>
  <section class="s-plan" id="plan"><div class="wrap plan-grid"><div id="plan-copy"></div><div id="leadbox"></div></div></section>
</main>
<footer><div class="wrap"><img src="assets/logos/tmp-logo.png" alt="The Missing P"><p id="foot-text"></p><a class="btn" href="#plan">Plan your TTT <span class="arr" aria-hidden="true">→</span></a></div></footer>
<div class="sticky" id="sticky"><p><b>Train the Trainer</b>Get a plan for your trainers in 1 min</p><a class="btn" href="#plan">Plan my TTT</a></div>
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
